<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcriber</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>YouTube Transcriber</h1>
            <p class="subtitle">Fetch transcripts from YouTube videos</p>
        </header>

        <main class="main">
            <section class="transcribe-form">
                <h2>Transcribe Video</h2>
                <form id="transcribe-form">
                    <div class="form-group">
                        <label for="url">YouTube URL</label>
                        <input 
                            type="text" 
                            id="url" 
                            name="url" 
                            placeholder="https://www.youtube.com/watch?v=..."
                            required
                        >
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="n-videos">Number of Videos</label>
                            <input 
                                type="number" 
                                id="n-videos" 
                                name="n" 
                                value="1" 
                                min="1" 
                                max="50"
                            >
                        </div>
                        <div class="form-group">
                            <label for="model-size">Model Size</label>
                            <select id="model-size" name="model_size">
                                <option value="tiny">tiny</option>
                                <option value="base" selected>base</option>
                                <option value="small">small</option>
                                <option value="medium">medium</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Transcribe</button>
                        <button type="button" id="get-videos-btn" class="btn btn-secondary">Get Videos</button>
                    </div>
                </form>
            </section>

            <section class="results" id="results-section" style="display: none;">
                <h2>Results</h2>
                <div id="results-content"></div>
            </section>

            <section class="transcripts-list">
                <h2>Saved Transcripts</h2>
                <button id="refresh-transcripts" class="btn btn-small">Refresh</button>
                <div id="transcripts-content">
                    <p class="loading">Loading...</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>YouTube Transcriber API v1.0.0</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
